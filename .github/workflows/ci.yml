name: Test

# Builds and tests on every pull request and push. Deploys nothing:
# deployments only run by hand, see deploy.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build all (hub + games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Everything as on the main domain: hub at /, each game at /<slug>/
      - run: npm run build

  test-shithead:
    name: Test Shithead
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/shithead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shithead
          path: |
            games/shithead/playwright-report/
            games/shithead/test-results/
          retention-days: 14
