name: CI & Deploy

# Every pull request and push: build everything, test only the games that changed.
# Every push to main: afterwards deploy the changed games to their own domains (Hetzner)
# and the preview (hub + all games) to GitHub Pages – only if build and tests are green.
# What counts as changed: scripts/ci-plan.js. Run by hand to test and deploy everything.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes to a pull request replace older runs; on main every run finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      deploy: ${{ steps.plan.outputs.deploy }}
      hub: ${{ steps.plan.outputs.hub }}
      playwright: ${{ steps.plan.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node scripts/ci-plan.js
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          ALL: ${{ github.event_name == 'workflow_dispatch' }}

  # Translation check + build of hub and all games (fast, so always everything).
  # Also the GitHub Pages preview: https://jankraut.github.io/hostelgames/ (noindex).
  build:
    name: Build all
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.hub == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Browser tests of each changed game, split into shards (testShards in game.json).
  # The Playwright image already contains Chromium and its system libraries.
  test:
    name: Test ${{ matrix.slug }} ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.plan.outputs.playwright }}-noble
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    defaults:
      run:
        working-directory: games/${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}
        env:
          HOME: /root
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.slug }}-${{ strategy.job-index }}
          path: |
            games/${{ matrix.slug }}/playwright-report/
            games/${{ matrix.slug }}/test-results/
          retention-days: 14

  # One deployment per changed site (each game, the hub) to its own domain. On Hetzner the FTP
  # login is the folder "hostelgames.com"; each site uploads into its own subfolder
  # named like its domain without the ending (shitheadgame.de → shitheadgame, hostelgames.com → hostelgames).
  # Each site can get its own environment (deploy.environment); until then all use "hetzner-webhosting".
  deploy:
    name: Deploy ${{ matrix.game.slug }}
    needs: [plan, build, test]
    if: >-
      always() && !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.plan.outputs.deploy != '[]'
      && needs.build.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.deploy) }}
    concurrency:
      group: deploy-${{ matrix.game.slug }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.game.environment }}
      url: ${{ matrix.game.domain }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Built here, not in "build": the tracking settings are variables of the environment.
      - run: npm run build -w ${{ matrix.game.workspace }}
        env:
          SITE_ORIGIN: ${{ matrix.game.domain }}
          SITE_PATH_PREFIX: /
          TRACKING_PROVIDER: ${{ vars.TRACKING_PROVIDER }}
          TRACKING_ID: ${{ vars.TRACKING_ID }}
          MATOMO_URL: ${{ vars.MATOMO_URL }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
      # Only changed files are sent; files no longer in the build are removed on the
      # server, so the target folder must belong to this game alone. The password goes
      # in via the environment and never appears on a command line or in the log.
      - name: Upload to Hetzner (FTPS)
        env:
          FTP_HOST: ${{ secrets.HETZNER_HOST }}
          FTP_USER: ${{ secrets.HETZNER_USER }}
          LFTP_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          FTP_DIR: ${{ matrix.game.ftpDir }}
          SITE: ${{ matrix.game.workspace }}/_site/
        run: |
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          mkdir -p -f "$FTP_DIR"
          mirror --reverse --delete --parallel=8 "$SITE" "$FTP_DIR"
          EOF

  # Preview of hub + all games: https://jankraut.github.io/hostelgames/<slug>/ (always noindex).
  pages:
    name: Deploy GitHub Pages
    needs: [plan, build, test]
    if: >-
      always() && !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.plan.outputs.hub == 'true'
      && needs.build.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # One fixed check for branch protection ("Require status checks to pass" → "CI ok"):
  # the test jobs above are created per game and shard, so their names change.
  ci-ok:
    name: CI ok
    needs: [plan, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build and tests green
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "plan=$PLAN build=$BUILD test=$TEST"
          [ "$PLAN" = success ] && [ "$BUILD" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }
