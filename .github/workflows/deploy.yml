name: Deploy (manual)

# Nothing here runs on its own: only via Actions → "Deploy (manual)" → Run workflow.
# Pick a target. Turning this into automatic deploys later means adding a `push` trigger.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        required: true
        type: choice
        options:
          - shithead-hetzner
          - github-pages

permissions:
  contents: read

jobs:
  # Shithead on its own domain (Hetzner webspace). Credentials live in the secrets of
  # the "hetzner-webhosting" environment, never in the repo.
  shithead-hetzner:
    if: inputs.target == 'shithead-hetzner'
    runs-on: ubuntu-latest
    concurrency:
      group: hetzner
      cancel-in-progress: false
    environment:
      name: hetzner-webhosting
      url: https://shitheadgame.de/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @hostelgames/shithead
        env:
          SITE_ORIGIN: https://shitheadgame.de
          SITE_PATH_PREFIX: /
          # Web analytics, set as variables of the environment (see README)
          TRACKING_PROVIDER: ${{ vars.TRACKING_PROVIDER }}
          TRACKING_ID: ${{ vars.TRACKING_ID }}
          MATOMO_URL: ${{ vars.MATOMO_URL }}
      # Upload with lftp: only changed files, files removed from the site are
      # removed on the server too. The password goes in via the environment,
      # so it never appears on a command line or in the log.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to Hetzner (FTPS)
        env:
          FTP_HOST: ${{ secrets.HETZNER_HOST }}
          FTP_USER: ${{ secrets.HETZNER_USER }}
          LFTP_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          FTP_DIR: ${{ vars.HETZNER_FTP_DIR || '.' }}
        run: |
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --delete --parallel=4 --verbose games/shithead/_site/ "$FTP_DIR"
          EOF

  # Preview of everything (hub + all games) on GitHub Pages, noindex:
  # https://jankraut.github.io/hostelgames/ and …/hostelgames/<game>/
  pages-build:
    if: inputs.target == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
