<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="back" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#c8243b"/>
      <rect width="2" height="4" fill="#a61c30"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f4cf71"/>
  <!-- four hidden cards in a 2x2 grid, one turned over showing 0 -->
  <g transform="rotate(-6 32 32)">
    <g fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35">
      <rect x="11" y="6" width="19" height="25" rx="3"/>
      <rect x="34" y="6" width="19" height="25" rx="3"/>
      <rect x="11" y="34" width="19" height="25" rx="3"/>
      <rect x="34" y="34" width="19" height="25" rx="3"/>
    </g>
    <g fill="url(#back)">
      <rect x="13" y="8" width="15" height="21" rx="2"/>
      <rect x="36" y="8" width="15" height="21" rx="2"/>
      <rect x="13" y="36" width="15" height="21" rx="2"/>
    </g>
    <text x="43.5" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="17" fill="#1a1d21">0</text>
  </g>
</svg>
