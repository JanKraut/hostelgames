<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#f4cf71"/>
  <!-- back card: King of hearts (the winner) -->
  <g transform="rotate(-14 26 40)">
    <rect x="11" y="13" width="28" height="40" rx="4" fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35"/>
    <text x="16" y="30" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="#c8243b">K</text>
    <text x="22" y="46" font-family="Arial, sans-serif" font-size="14" fill="#c8243b">♥</text>
  </g>
  <!-- front card: upside-down, cracked crown (from king to asshole) -->
  <g transform="rotate(10 38 40)">
    <rect x="25" y="10" width="28" height="40" rx="4" fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35"/>
    <g transform="rotate(180 39 30)">
      <path d="M29.5 37l-1.5-13 6.5 5.5L39 21l4.5 8.5 6.5-5.5-1.5 13z" fill="#e8a317" stroke="#8a5a00" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="29.5" y="37" width="19" height="4" rx="1" fill="#d68400" stroke="#8a5a00" stroke-width="1.2"/>
      <circle cx="28" cy="24" r="1.8" fill="#c8243b"/>
      <circle cx="39" cy="21" r="1.8" fill="#c8243b"/>
      <circle cx="50" cy="24" r="1.8" fill="#c8243b"/>
      <path d="M40 41l-1.6-5 2.4-2.6-1.8-4.4" fill="none" stroke="#5a3a00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
