<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#f4cf71"/>
  <!-- back card: King of hearts (the winner) -->
  <g transform="rotate(-14 26 40)">
    <rect x="11" y="13" width="28" height="40" rx="4" fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35"/>
    <text x="16" y="30" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="#c8243b">K</text>
    <text x="22" y="46" font-family="Arial, sans-serif" font-size="14" fill="#c8243b">♥</text>
  </g>
  <!-- front card with a cheeky peach (the asshole) -->
  <g transform="rotate(10 38 40)">
    <rect x="25" y="10" width="28" height="40" rx="4" fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35"/>
    <path d="M39 22c-2.6-2.4-8-2-9.4 3-1.3 4.6.6 10.4 4.4 13.6 2 1.7 3.6 2.2 5 1.2 1.4 1 3 .5 5-1.2 3.8-3.2 5.7-9 4.4-13.6-1.4-5-6.8-5.4-9.4-3z" fill="#f08a5d"/>
    <path d="M39 23.5c-.6 5 .2 11 0 16.6" fill="none" stroke="#c4553a" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="34" cy="27" rx="1.8" ry="2.8" fill="#fff" opacity=".45" transform="rotate(20 34 27)"/>
    <path d="M39 22.5c.4-2.6 2-4.3 4.2-4.8-.2 2.6-1.8 4.3-4.2 4.8z" fill="#5d8a3a"/>
  </g>
