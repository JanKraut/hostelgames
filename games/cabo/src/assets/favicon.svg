<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="back" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#c8243b"/>
      <rect width="2" height="4" fill="#a61c30"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f4cf71"/>
  <!-- card back -->
  <g transform="rotate(-14 32 40)">
    <rect x="13" y="13" width="28" height="40" rx="4" fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35"/>
    <rect x="15.5" y="15.5" width="23" height="35" rx="2.5" fill="url(#back)"/>
  </g>
  <!-- front card with a peeking eye -->
  <g transform="rotate(10 38 40)">
    <rect x="24" y="10" width="28" height="40" rx="4" fill="#fbfaf6" stroke="#4a3d22" stroke-opacity=".35"/>
    <path d="M27 30c6.5-9 15.5-9 22 0-6.5 9-15.5 9-22 0z" fill="#fff" stroke="#1a1d21" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="38" cy="30" r="5" fill="#c8243b"/>
    <circle cx="38" cy="30" r="2.3" fill="#1a1d21"/>
    <circle cx="39.6" cy="28.4" r="1.1" fill="#fff"/>
  </g>
</svg>
